[metadata]
description_file = README.md


[flake8]
max-line-length = 88
author-attribute = forbidden
no-accept-encodings = True
assertive-snakecase = True
# assertive-test-pattern = <fnmatch>
inline-quotes = "
multiline-quotes = """
docstring-quotes = """
application-import-names = satosa

[isort]
profile = "black"
skip_gitignore = true

[tool.commitizen]
bump_message = "bump: release version $new_version"
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true

hang_closing = false
doctests = false
max-complexity = 10
exclude =
    .git
    __pycache__
    doc/source/conf.py
    docs/source/conf.py
    build
    dist
